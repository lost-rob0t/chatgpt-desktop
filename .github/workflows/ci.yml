name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  upstream-rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install inspection tools
        run: dnf install -y curl rpm cpio findutils coreutils file binutils

      - name: Inspect official ChatGPT RPM
        shell: bash
        run: |
          set -euo pipefail
          rpm_path=/tmp/chatgpt.x86_64.rpm
          inspect="$GITHUB_WORKSPACE/inspect"
          info="$GITHUB_WORKSPACE/rpm-info.txt"
          mkdir -p "$inspect"

          curl --fail --location --retry 3 \
            --output "$rpm_path" \
            https://persistent.oaistatic.com/codex-app-prod/linux/rpm/latest/chatgpt.x86_64.rpm

          cd "$inspect"
          rpm2cpio "$rpm_path" | cpio -idm --quiet \
            './usr/bin/chatgpt' \
            './usr/lib/chatgpt/ChatGPT' \
            './usr/lib/chatgpt/codex-launcher' \
            './usr/share/applications/chatgpt.desktop' \
            './etc/apparmor.d/chatgpt'

          {
            printf 'PACKAGE_SHA256=%s\n' "$(sha256sum "$rpm_path" | awk '{print $1}')"
            rpm -qp --queryformat $'PACKAGE_NAME=%{NAME}\nPACKAGE_VERSION=%{VERSION}\nPACKAGE_RELEASE=%{RELEASE}\nPACKAGE_ARCH=%{ARCH}\nPACKAGE_LICENSE=%{LICENSE}\nPACKAGE_URL=%{URL}\nPACKAGE_SUMMARY=%{SUMMARY}\n' "$rpm_path"
            echo '--- RPM REQUIRES ---'
            rpm -qpR "$rpm_path" | sort
            echo '--- LAUNCHER ---'
            ls -l ./usr/bin/chatgpt
            file ./usr/bin/chatgpt ./usr/lib/chatgpt/ChatGPT ./usr/lib/chatgpt/codex-launcher
            echo '--- DESKTOP FILE ---'
            cat ./usr/share/applications/chatgpt.desktop
            echo '--- MAIN ELF NEEDED ---'
            readelf -d ./usr/lib/chatgpt/ChatGPT | grep NEEDED || true
            echo '--- RPM FILES ---'
            rpm -qlp "$rpm_path" | sort
          } | tee "$info"

      - name: Upload RPM metadata
        uses: actions/upload-artifact@v4
        with:
          name: rpm-info
          path: |
            rpm-info.txt
            inspect/usr/bin/chatgpt
            inspect/usr/share/applications/chatgpt.desktop
            inspect/etc/apparmor.d/chatgpt

  nix-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Lock flake
        run: nix flake lock

      - name: Check flake
        run: nix flake check --show-trace

      - name: Build package
        run: nix build .#chatgpt-desktop --print-build-logs

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          test -L result/bin/chatgpt
          test -x result/lib/chatgpt/ChatGPT
          test -f result/share/applications/chatgpt.desktop
          ldd result/lib/chatgpt/ChatGPT | tee /tmp/chatgpt-ldd.txt
          ! grep -q 'not found' /tmp/chatgpt-ldd.txt
          grep -F "Exec=$(readlink -f result)/bin/chatgpt %U" \
            result/share/applications/chatgpt.desktop

      - name: Upload lock file
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock
